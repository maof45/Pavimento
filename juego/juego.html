<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Escalera al Cielo - Para Priscila</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            overflow: hidden;
            background: url('fondo.jpg') center/cover no-repeat, linear-gradient(180deg, #1e3c72 0%, #2a5298 50%, #7e22ce 100%);
            font-family: 'Arial', sans-serif;
            touch-action: none;
            transition: background 2s ease;
        }

        body.victory {
            background: url('fondo.jpg') center/cover no-repeat, linear-gradient(180deg, #ff6b9d 0%, #feca57 50%, #ff9ff3 100%);
        }

        canvas {
            display: block;
            background: transparent;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            color: white;
            font-size: 24px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            z-index: 10;
        }

        #lives {
            font-size: 30px;
            margin-top: 10px;
        }

        #controls {
            position: absolute;
            bottom: 30px;
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px;
            z-index: 10;
        }

        .btn {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.3);
            border: 3px solid white;
            font-size: 35px;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            touch-action: none;
        }

        #victory {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: linear-gradient(135deg, rgba(255, 107, 157, 0.95), rgba(254, 202, 87, 0.95));
            padding: 50px;
            border-radius: 30px;
            color: white;
            text-align: center;
            display: none;
            z-index: 100;
            max-width: 90%;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
        }

        #victory h1 {
            font-size: 42px;
            margin-bottom: 25px;
            color: white;
            text-shadow: 3px 3px 6px rgba(0, 0, 0, 0.3);
        }

        #victory p {
            font-size: 28px;
            margin: 20px 0;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        #victoryPhoto {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid white;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            margin: 20px auto;
            display: block;
        }

        #gameOver {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 40px;
            border-radius: 20px;
            color: white;
            text-align: center;
            display: none;
            z-index: 100;
        }

        #gameOver h1 {
            font-size: 32px;
            margin-bottom: 20px;
        }

        #restartBtn {
            margin-top: 20px;
            padding: 15px 30px;
            font-size: 20px;
            background: #ff69b4;
            color: white;
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <audio id="bgMusic" loop>
        <source src="sabes.mp3" type="audio/mpeg">
    </audio>
    <div id="ui">
        <div>Paso: <span id="currentStep">0</span>/30</div>
        <div id="lives">❤️❤️❤️❤️❤️</div>
    </div>
    <div id="controls">
        <div class="btn" id="leftBtn">←</div>
        <div class="btn" id="jumpBtn">↑</div>
        <div class="btn" id="rightBtn">→</div>
    </div>
    <div id="victory">
        <h1>🎊 ¡LLEGASTE A LA CIMA! 🎊</h1><img id="victoryPhoto" src="image.jpg" alt="Priscila">
        <p id="lovePhrase"></p>
        <p style="font-size: 60px; margin-top: 30px;">💖✨🌟✨💖</p>
    </div>
    <div id="gameOver">
        <h1>💔 Perdiste todas las vidas</h1><button id="restartBtn">Intentar de nuevo</button>
    </div>
    <canvas id="gameCanvas"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        const GRAVITY = 0.4, JUMP_FORCE = -12, MOVE_SPEED = 4, AIR_CONTROL = 0.95;

        const victoryPhrases = ["¡Eres increíble, mi amor! 💕", "¡Lo lograste, mi vida! 🌟", "¡Eres mi campeona! 👑", "¡Juntos podemos todo! 💖", "¡Tu amor me inspira! ✨", "¡Eres mi estrella brillante! ⭐", "¡Te amo más que nunca! 💗", "¡Eres mi todo! 💝"];

        const romanticWords = ["MARCO", "PRISCILA", "JUNTOS", "AMOR", "VIDA", "MARCO", "CORAZÓN", "PRISCILA", "SUEÑO", "JUNTOS", "BESO", "MARCO", "PASIÓN", "PRISCILA", "TERNURA", "JUNTOS", "CIELO", "MARCO", "ESTRELLA", "PRISCILA", "LUNA", "JUNTOS", "FELIZ", "MARCO", "DICHA", "PRISCILA", "TESORO", "JUNTOS", "ETERNO", "SIEMPRE"];

        let player = { x: canvas.width / 2, y: canvas.height - 100, width: 40, height: 40, vx: 0, vy: 0, onGround: false, color: '#ff1493', lives: 5, invincible: false, canDoubleJump: false };
        let platforms = [], birds = [];
        const platformWidth = 120, platformHeight = 30;

        function generatePlatforms() {
            platforms = []; birds = [];
            platforms.push({ x: canvas.width / 2 - 60, y: canvas.height - 50, width: 120, height: 30, word: 'INICIO', index: 0 });
            let currentY = canvas.height - 180;
            for (let i = 0; i < 30; i++) {
                const lateralOffset = (Math.random() - 0.5) * (canvas.width * 0.4);
                const x = canvas.width / 2 - platformWidth / 2 + lateralOffset;
                platforms.push({ x: Math.max(20, Math.min(canvas.width - platformWidth - 20, x)), y: currentY, width: platformWidth, height: platformHeight, word: romanticWords[i], index: i + 1 });
                currentY -= 95;
            }
            platforms.push({ x: canvas.width / 2 - 100, y: currentY - 150, width: 200, height: 40, word: '💖 CIMA 💖', index: 31 });
            for (let i = 0; i < 10; i++) {
                birds.push({ x: Math.random() * canvas.width, y: canvas.height - 500 - Math.random() * 3000, vx: (Math.random() > 0.5 ? 1 : -1) * (2 + Math.random() * 2), type: Math.random() > 0.4 ? 'bad' : 'good', size: 30, collected: false });
            }
        }
        generatePlatforms();

        let cameraY = 0, currentStepIndex = 0, keys = { left: false, right: false, jump: false };
        const music = document.getElementById('bgMusic');

        document.getElementById('leftBtn').addEventListener('touchstart', (e) => { e.preventDefault(); keys.left = true; });
        document.getElementById('leftBtn').addEventListener('touchend', (e) => { e.preventDefault(); keys.left = false; });
        document.getElementById('rightBtn').addEventListener('touchstart', (e) => { e.preventDefault(); keys.right = true; });
        document.getElementById('rightBtn').addEventListener('touchend', (e) => { e.preventDefault(); keys.right = false; });
        document.getElementById('jumpBtn').addEventListener('touchstart', (e) => { e.preventDefault(); if (player.onGround) { player.vy = JUMP_FORCE; player.onGround = false; player.canDoubleJump = true; } else if (player.canDoubleJump) { player.vy = JUMP_FORCE; player.canDoubleJump = false; } });

        window.addEventListener('keydown', (e) => { if (e.key === 'ArrowLeft') keys.left = true; if (e.key === 'ArrowRight') keys.right = true; if (e.key === ' ' || e.key === 'ArrowUp') { if (player.onGround) { player.vy = JUMP_FORCE; player.onGround = false; player.canDoubleJump = true; } else if (player.canDoubleJump) { player.vy = JUMP_FORCE; player.canDoubleJump = false; } } });
        window.addEventListener('keyup', (e) => { if (e.key === 'ArrowLeft') keys.left = false; if (e.key === 'ArrowRight') keys.right = false; });

        const fireworks = [];
        let gameWon = false, gameOver = false;

        function createFirework(x, y) {
            const particles = [], colors = ['#ff1493', '#ff69b4', '#ffd700', '#00ffff', '#ff00ff', '#feca57', '#ff6b9d'];
            for (let i = 0; i < 50; i++) {
                const angle = (Math.PI * 2 * i) / 50, speed = 4 + Math.random() * 5;
                particles.push({ x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed, color: colors[Math.floor(Math.random() * colors.length)], life: 150 });
            }
            fireworks.push(...particles);
        }

        function loseLife() {
            if (player.invincible) return;
            player.lives--;
            player.invincible = true;
            setTimeout(() => player.invincible = false, 2000);
            document.getElementById('lives').textContent = '❤️'.repeat(player.lives);
            if (player.lives <= 0) { gameOver = true; music.pause(); document.getElementById('gameOver').style.display = 'block'; }
            else {
                const lastPlatform = platforms.find(p => p.index === currentStepIndex);
                if (lastPlatform) { player.x = lastPlatform.x + lastPlatform.width / 2; player.y = lastPlatform.y - player.height - 10; player.vx = 0; player.vy = 0; }
            }
        }

        function gainLife() { if (player.lives < 5) { player.lives++; document.getElementById('lives').textContent = '❤️'.repeat(player.lives); } }

        document.getElementById('restartBtn').addEventListener('click', () => {
            player.lives = 5; player.x = canvas.width / 2; player.y = canvas.height - 100; player.vx = 0; player.vy = 0; player.invincible = false; player.canDoubleJump = false; currentStepIndex = 0; cameraY = 0; gameOver = false; gameWon = false;
            document.body.classList.remove('victory'); document.getElementById('gameOver').style.display = 'none'; document.getElementById('victory').style.display = 'none';
            document.getElementById('lives').textContent = '❤️❤️❤️❤️❤️'; document.getElementById('currentStep').textContent = '0';
            generatePlatforms(); music.currentTime = 0; music.play();
        });

        function update() {
            if (gameWon) { for (let i = fireworks.length - 1; i >= 0; i--) { const p = fireworks[i]; p.x += p.vx; p.y += p.vy; p.vy += 0.15; p.life--; if (p.life <= 0) fireworks.splice(i, 1); } return; }
            if (gameOver) return;

            if (keys.left) player.vx = -MOVE_SPEED; else if (keys.right) player.vx = MOVE_SPEED; else player.vx *= AIR_CONTROL;
            player.vy += GRAVITY; player.x += player.vx; player.y += player.vy;
            if (player.x < -player.width) player.x = canvas.width; if (player.x > canvas.width) player.x = -player.width;
            if (player.y > canvas.height + cameraY + 100) loseLife();

            for (const bird of birds) {
                bird.x += bird.vx;
                if (bird.x < -50) bird.x = canvas.width + 50; if (bird.x > canvas.width + 50) bird.x = -50;
                if (!bird.collected) {
                    const dist = Math.sqrt(Math.pow(player.x + player.width / 2 - bird.x, 2) + Math.pow(player.y + player.height / 2 - bird.y, 2));
                    if (dist < bird.size + player.width / 2) { bird.collected = true; if (bird.type === 'bad') loseLife(); else gainLife(); }
                }
            }

            player.onGround = false;
            for (const platform of platforms) {
                if (player.vy > 0 && player.x + player.width > platform.x && player.x < platform.x + platform.width && player.y + player.height > platform.y && player.y + player.height < platform.y + platform.height + 15) {
                    player.y = platform.y - player.height; player.vy = 0; player.onGround = true; player.canDoubleJump = true;
                    if (platform.index > currentStepIndex) { currentStepIndex = platform.index; document.getElementById('currentStep').textContent = currentStepIndex; }
                }
            }

            if (player.y < canvas.height / 2) cameraY = player.y - canvas.height / 2;

            const summitPlatform = platforms.find(p => p.word === '💖 CIMA 💖');
            if (summitPlatform && player.y < summitPlatform.y && !gameWon) {
                gameWon = true; document.body.classList.add('victory'); document.getElementById('victory').style.display = 'block';
                document.getElementById('lovePhrase').textContent = victoryPhrases[Math.floor(Math.random() * victoryPhrases.length)];
                for (let i = 0; i < 20; i++) setTimeout(() => createFirework(Math.random() * canvas.width, Math.random() * canvas.height / 2), i * 200);
            }
        }

        function draw() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.save(); ctx.translate(0, -cameraY);

            for (const platform of platforms) {
                const gradient = ctx.createLinearGradient(platform.x, platform.y, platform.x + platform.width, platform.y + platform.height);
                gradient.addColorStop(0, '#ff6b9d'); gradient.addColorStop(1, '#c44569');
                ctx.fillStyle = gradient; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.shadowColor = 'rgba(255,107,157,0.5)'; ctx.shadowBlur = 10;
                ctx.beginPath(); ctx.roundRect(platform.x, platform.y, platform.width, platform.height, 15); ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
                ctx.fillStyle = '#fff'; ctx.font = 'bold 18px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(platform.word, platform.x + platform.width / 2, platform.y + platform.height / 2);
            }

            for (const bird of birds) { if (!bird.collected) { ctx.font = '40px Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText(bird.type === 'bad' ? '🦅' : '🕊️', bird.x, bird.y); } }

            if (!player.invincible || Math.floor(Date.now() / 100) % 2 === 0) {
                ctx.fillStyle = player.color; ctx.strokeStyle = '#ff69b4'; ctx.lineWidth = 3; ctx.shadowColor = 'rgba(255,20,147,0.8)'; ctx.shadowBlur = 15;
                const px = player.x + player.width / 2, py = player.y + player.height / 2, size = player.width / 2;
                ctx.beginPath(); ctx.moveTo(px, py + size / 2);
                ctx.bezierCurveTo(px, py - size / 2, px - size * 1.5, py - size / 2, px - size * 1.5, py);
                ctx.bezierCurveTo(px - size * 1.5, py + size / 2, px, py + size * 1.5, px, py + size * 2);
                ctx.bezierCurveTo(px, py + size * 1.5, px + size * 1.5, py + size / 2, px + size * 1.5, py);
                ctx.bezierCurveTo(px + size * 1.5, py - size / 2, px, py - size / 2, px, py + size / 2);
                ctx.fill(); ctx.stroke(); ctx.shadowBlur = 0;
            }
            ctx.restore();

            if (gameWon) { for (const p of fireworks) { ctx.fillStyle = p.color; ctx.globalAlpha = p.life / 150; ctx.shadowColor = p.color; ctx.shadowBlur = 10; ctx.beginPath(); ctx.arc(p.x, p.y, 5, 0, Math.PI * 2); ctx.fill(); } ctx.globalAlpha = 1; ctx.shadowBlur = 0; }
        }

        function gameLoop() { update(); draw(); requestAnimationFrame(gameLoop); }
        window.addEventListener('resize', () => { canvas.width = window.innerWidth; canvas.height = window.innerHeight; });
        document.addEventListener('click', () => { music.play().catch(e => console.log('Audio play failed:', e)); }, { once: true });
        gameLoop();
    </script>
</body>

</html>
